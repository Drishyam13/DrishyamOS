version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: drishyam-postgres-prod
    restart: always
    environment:
      POSTGRES_USER: drishyam_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-drishyam_secure_prod_pass}
      POSTGRES_DB: drishyam_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_prod_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U drishyam_user -d drishyam_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: drishyam-redis-prod
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_prod_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:RELEASE.2023-09-04T19-57-37Z
    container_name: drishyam-minio-prod
    restart: always
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_PASS:-minioadmin}
    command: server /data --console-address ":9001"
    volumes:
      - minio_prod_data:/data

  api:
    build:
      context: ..
      dockerfile: services/api/Dockerfile
    container_name: drishyam-api-prod
    restart: always
    ports:
      - "4000:4000"
    environment:
      NODE_ENV: production
      DATABASE_URL: "postgresql://drishyam_user:${POSTGRES_PASSWORD:-drishyam_secure_prod_pass}@postgres:5432/drishyam_db?schema=public"
      REDIS_URL: "redis://redis:6379"
      PORT: 4000
      JWT_SECRET: ${JWT_SECRET:-drishyam-prod-jwt-secret-key-998877}
      EDGE_SERVICE_TOKEN: ${EDGE_SERVICE_TOKEN:-drishyam-edge-service-secret-token-123}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  web:
    build:
      context: ..
      dockerfile: apps/web/Dockerfile
    container_name: drishyam-web-prod
    restart: always
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: "http://localhost/api/v1"
      NEXT_PUBLIC_WS_URL: "http://localhost"
    depends_on:
      - api

  edge-agent:
    build:
      context: ..
      dockerfile: apps/edge-agent/Dockerfile
    container_name: drishyam-edge-agent-prod
    restart: always
    environment:
      API_URL: "http://api:4000/api/v1"
      EDGE_SERVICE_TOKEN: ${EDGE_SERVICE_TOKEN:-drishyam-edge-service-secret-token-123}
      SIMULATE_EVENTS: "true"
    depends_on:
      - api

  nginx:
    image: nginx:1.25-alpine
    container_name: drishyam-nginx-prod
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - web
      - api

volumes:
  postgres_prod_data:
  redis_prod_data:
  minio_prod_data:
