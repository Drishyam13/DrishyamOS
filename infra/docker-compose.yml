version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: drishyam-postgres
    restart: always
    environment:
      POSTGRES_USER: drishyam_user
      POSTGRES_PASSWORD: drishyam_pass
      POSTGRES_DB: drishyam_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: drishyam-redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  minio:
    image: minio/minio:RELEASE.2023-09-04T19-57-37Z
    container_name: drishyam-minio
    restart: always
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data

  api:
    build:
      context: ..
      dockerfile: services/api/Dockerfile
    container_name: drishyam-api
    restart: always
    ports:
      - "4000:4000"
    environment:
      DATABASE_URL: "postgresql://drishyam_user:drishyam_pass@postgres:5432/drishyam_db?schema=public"
      REDIS_URL: "redis://redis:6379"
      PORT: 4000
    depends_on:
      - postgres
      - redis

  web:
    build:
      context: ..
      dockerfile: apps/web/Dockerfile
    container_name: drishyam-web
    restart: always
    ports:
      - "3000:3000"
    depends_on:
      - api

volumes:
  postgres_data:
  redis_data:
  minio_data:
