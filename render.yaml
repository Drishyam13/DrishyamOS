# Render.yaml - 100% Free Tier Blueprint for Render Deployment

services:
  # 1. Managed Redis Cache & PubSub
  - type: redis
    name: drishyam-redis
    region: singapore
    plan: free
    ipAllowList: []

  # 2. Backend API & Real-time WebSocket Server + Automated Cron Workers
  - type: web
    name: drishyam-api
    env: node
    region: singapore
    plan: free
    buildCommand: npm install --include=dev --fetch-retries=5 --no-audit && npm run build:shared && npx prisma generate --schema=services/api/prisma/schema.prisma && npm run build:api
    startCommand: cd services/api && npx prisma db push --accept-data-loss ; node dist/seed.js ; node dist/index.js
    healthCheckPath: /health
    envVars:
      - key: PORT
        value: 4000
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: drishyam-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: drishyam-redis
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: EDGE_SERVICE_TOKEN
        generateValue: true

  # 3. Next.js SOC Control Room Web Dashboard
  - type: web
    name: drishyam-web
    env: node
    region: singapore
    plan: free
    buildCommand: npm install --include=dev --fetch-retries=5 --no-audit && npm run build:shared && npm run build:web
    startCommand: cd apps/web && npm start
    envVars:
      - key: PORT
        value: 3000
      - key: NODE_ENV
        value: production
      - key: NEXT_PUBLIC_API_URL
        value: https://drishyam-api.onrender.com
      - key: NEXT_PUBLIC_WS_URL
        value: https://drishyam-api.onrender.com

  # 4. Python AI Computer Vision Edge Agent Worker
  - type: worker
    name: drishyam-edge-agent
    env: python
    region: singapore
    plan: free
    buildCommand: pip install -r apps/edge-agent/requirements.txt
    startCommand: python apps/edge-agent/main.py
    envVars:
      - key: API_URL
        fromService:
          type: web
          name: drishyam-api
          property: host
      - key: EDGE_SERVICE_TOKEN
        fromService:
          type: web
          name: drishyam-api
          envVarKey: EDGE_SERVICE_TOKEN
      - key: SIMULATE_EVENTS
        value: "true"

# Managed PostgreSQL Database on Render (Free Tier)
databases:
  - name: drishyam-db
    databaseName: drishyam_db
    user: drishyam_user
    region: singapore
    plan: free
